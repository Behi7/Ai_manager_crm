name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_manager_test
          POSTGRES_USER: ai_user
          POSTGRES_PASSWORD: ai_secure_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_user -d ai_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ai_user:ai_secure_password_123@127.0.0.1:5432/ai_manager_test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GEMINI_API_KEY: test_gemini_api_key
      HOST: 0.0.0.0
      PORT: 8080
      ENVIRONMENT: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Apply database migrations
        run: |
          alembic upgrade head

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Code quality check with ruff
        run: |
          ruff check .
